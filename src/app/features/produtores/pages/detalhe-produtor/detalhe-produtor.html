<div class="page">

  <section class="perfil">

    <img
      [src]="produtor.foto"
      alt="Produtor"
    >

    <div>

      <h1>
        {{ produtor.nome }}
      </h1>

      <p class="cidade">
        {{ produtor.cidade }}
      </p>

      <p class="descricao">
        {{ produtor.descricao }}
      </p>

      <button class="btn-whatsapp">
        Entrar em contato
      </button>

    </div>

  </section>

</div>
