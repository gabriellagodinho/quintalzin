<div class="container" *ngIf="produto">

  <button class="btn-voltar" (click)="voltar()">
    ← Voltar
  </button>

  <div class="detalhe-layout">

    <div class="imagem-section">

      <img [src]="produto.imagem" alt="produto">

      <span class="badge">
        {{produto.quantidade}} disponíveis
      </span>

    </div>

    <div class="info-section">

      <span class="categoria">
        🌱 Produto Local
      </span>

      <h1 class="nome">
        {{produto.nome}}
      </h1>

      <p class="produtor">
        👨‍🌾 {{produto.produtor}}
      </p>

      <p class="cidade">
        📍 {{produto.cidade}}
      </p>

      <p class="descricao">
        {{produto.descricao}}
      </p>

      <div class="preco-box">

        <span class="label">
          Preço
        </span>

        <span class="preco">
          R$ {{produto.preco}}
        </span>

      </div>

      <button
        class="btn-whatsapp"
        (click)="abrirWhatsApp()"
      >
        💬 Falar com produtor
      </button>

    </div>

  </div>

</div>
