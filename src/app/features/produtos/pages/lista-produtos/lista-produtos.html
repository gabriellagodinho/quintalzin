<div class="page">

  <section class="hero">

    <span class="hero-badge">
      🌱 Direto do produtor
    </span>

    <h1>
      Produtos frescos da sua região
    </h1>

    <p>
      Conectando agricultores locais diretamente aos consumidores.
    </p>

  </section>

  <section class="filtros">

    <input
      type="text"
      placeholder="Buscar produto ou produtor..."
      [(ngModel)]="busca"
      class="input-busca"
    >

    <select [(ngModel)]="cidade" class="select">
      <option value="">Todas as cidades</option>
      <option *ngFor="let c of cidades">{{c}}</option>
    </select>

    <select [(ngModel)]="tipoProduto" class="select">
      <option value="">Todos os produtos</option>
      <option *ngFor="let t of tiposProdutos">{{t}}</option>
    </select>

  </section>

  <section class="produtos-grid">

    <div
      class="produto-card"
      *ngFor="let produto of produtos"
      (click)="verProduto(produto)"
    >

      <div class="produto-img">

        <img [src]="produto.imagem" alt="produto">

        <span class="badge">
          {{produto.quantidade}} disponíveis
        </span>

      </div>

      <div class="produto-info">

        <p class="categoria">
          Produto Local
        </p>

        <h2>{{produto.nome}}</h2>

        <p class="produtor">
          👨‍🌾 {{produto.produtor}}
        </p>

        <p class="cidade">
          📍 {{produto.cidade}}
        </p>

        <div class="footer-card">

          <span class="preco">
            R$ {{produto.preco}}
          </span>

          <button
            class="btn"
            (click)="$event.stopPropagation()"
          >
            Falar com produtor
          </button>

        </div>

      </div>

    </div>

  </section>

</div>
